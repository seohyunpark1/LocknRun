[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
lockrun_escrow = "DNCsEVz5mRUwJTKpXE1z478PSxKSrRVVW2GMAr3ByDAj"

[programs.devnet]
lockrun_escrow = "DNCsEVz5mRUwJTKpXE1z478PSxKSrRVVW2GMAr3ByDAj"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/practice-wallet.json"

[scripts]
test = "node --conditions=react-server --import tsx --test anchor-tests/escrow.test.ts anchor-tests/app-flow.test.ts"

# Localnet stand-in for Circle's devnet USDC mint (same address, test-only mint authority in anchor-tests/test-authority.json)
[[test.validator.account]]
address = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
filename = "anchor-tests/usdc-mint.json"
